<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat Ruang Belajar - Genius</title>
    
    <meta name="theme-color" content="#1E3A8A">
    <link rel="icon" href="https://i.imgur.com/PpxQu9m.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.imgur.com/PpxQu9m.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- ONESIGNAL -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "ecc3da18-8ac0-43ab-8346-fca21f11fa07",
        });
      });
    </script>

    <style>
        :root {
            --primary: #1E3A8A;
            --primary-light: #3B82F6;
            --bg: #E2E8F0;
            --surface: #F8FAFC;
            --chat-bg: #efeae2;
            --text-primary: #1E293B;
            --text-muted: #64748B;
            --bubble-incoming: #FFFFFF;
            --bubble-outgoing: #d9fdd3;
            --font: 'Poppins', sans-serif;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --app-height: 100vh;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: var(--font); background: var(--bg);
            width: 100%; height: var(--app-height); overflow: hidden; 
            display: flex; justify-content: center; align-items: center; position: fixed;
            top: 0; left: 0;
        }

        .chat-app {
            width: 100%; max-width: 480px; height: 100%;
            background: var(--surface); display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        /* HEADER */
        .chat-header {
            flex-shrink: 0; background: linear-gradient(135deg, rgba(30, 58, 138, 0.95), rgba(59, 130, 246, 0.95));
            color: white; padding: 14px 18px; display: flex; align-items: center; gap: 12px;
            z-index: 10; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(30, 58, 138, 0.15); 
            padding-top: max(14px, env(safe-area-inset-top)); 
        }

        .room-avatar {
            width: 42px; height: 42px; background: rgba(255,255,255,0.2);
            border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 22px; flex-shrink: 0;
        }

        .header-info { flex: 1; min-width: 0; cursor: pointer; }
        .header-info h2 { font-size: 0.95rem; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-info p { font-size: 0.7rem; color: rgba(255, 255, 255, 0.8); display: flex; align-items: center; gap: 4px; }
        
        .btn-back {
            color: rgba(255, 255, 255, 0.85); background: none; border: none; font-size: 1.4rem;
            padding: 8px; cursor: pointer; display: flex; text-decoration: none; transition: 0.2s;
        }
        .btn-back:hover { color: white; }

        /* CHAT BODY */
        .chat-body {
            flex: 1 1 auto; background-color: var(--chat-bg);
            background-image: radial-gradient(#cbd5e1 0.75px, transparent 0.75px);
            background-size: 16px 16px;
            overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;
            padding: 16px; display: flex; flex-direction: column; gap: 10px;
        }

        .chat-body::-webkit-scrollbar { width: 4px; }
        .chat-body::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 0.8); border-radius: 10px; }

        /* MESSAGE BUBBLE */
        .message-row { display: flex; flex-direction: column; max-width: 82%; animation: popIn 0.2s ease both; }
        .message-row.incoming { align-self: flex-start; }
        .message-row.outgoing { align-self: flex-end; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .sender-name { font-size: 0.7rem; font-weight: 600; color: var(--primary); margin-bottom: 2px; padding-left: 4px; }
        .message-row.outgoing .sender-name { display: none; }

        .bubble {
            padding: 10px 14px; font-size: 0.85rem; line-height: 1.5; word-break: break-word;
            border-radius: 12px; position: relative; box-shadow: var(--shadow-sm); cursor: pointer;
        }
        .message-row.incoming .bubble { background: var(--bubble-incoming); color: var(--text-primary); border-top-left-radius: 2px; }
        .message-row.outgoing .bubble { background: var(--bubble-outgoing); color: var(--text-primary); border-top-right-radius: 2px; }

        .bubble img {
            width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; display: block;
        }

        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 0.6rem; color: var(--text-muted); margin-top: 3px; padding-right: 2px; }

        /* FOOTER INPUT */
        .chat-footer {
            flex-shrink: 0; padding: 10px 12px; 
            padding-bottom: max(12px, env(safe-area-inset-top));
            background: rgba(248, 250, 252, 0.98); border-top: 1px solid #E2E8F0;
            display: flex; gap: 8px; align-items: flex-end; box-shadow: 0 -4px 15px rgba(0,0,0,0.03); z-index: 100;
        }

        .btn-attach {
            background: none; border: none; font-size: 1.4rem; color: var(--text-muted);
            width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .btn-attach:active { color: var(--primary); }

        .input-wrap {
            flex: 1; display: flex; align-items: center; background: white;
            border: 1.5px solid #CBD5E1; border-radius: 20px; padding: 0 12px; min-height: 42px;
        }
        .input-wrap:focus-within { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12); }

        .input-box {
            flex: 1; border: none; background: transparent; font-size: 0.9rem; font-family: var(--font);
            color: var(--text-primary); resize: none; max-height: 100px; line-height: 1.4; padding: 10px 0; outline: none;
        }

        .btn-send {
            background: var(--primary); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.1rem; cursor: pointer; flex-shrink: 0; transition: 0.2s;
        }
        .btn-send:active:not(:disabled) { transform: scale(0.92); }
        .btn-send:disabled { background: #CBD5E1; cursor: not-allowed; }

        /* LIGHTBOX ZOOM MODAL */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 20px;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; object-fit: contain; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; background: none; border: none; cursor: pointer; }

        /* SWEETALERT CUSTOM */
        .swal2-popup { border-radius: 20px !important; padding: 20px !important; }
        .swal2-title { font-size: 1.1rem !important; color: var(--text-primary) !important; font-family: var(--font) !important; }
    </style>
</head>
<body>

    <div class="chat-app">
        <!-- HEADER -->
        <header class="chat-header">
            <a href="ruang-belajar.html" class="btn-back"><i class="ph-bold ph-caret-left"></i></a>
            <div class="room-avatar"><i class="ph-fill ph-users"></i></div>
            <div class="header-info" id="btn-room-info" title="Ketuk untuk salin kode">
                <h2 id="room-name">Memuat Ruangan...</h2>
                <p><span id="room-code-txt">Kode: ...</span> • Ketuk salin</p>
            </div>
        </header>

        <!-- CHAT BODY -->
        <main class="chat-body" id="chat-box">
            <!-- Pesan akan dirender realtime di sini -->
        </main>

        <!-- FOOTER INPUT -->
        <form class="chat-footer" id="chat-form">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button type="button" class="btn-attach" id="btn-attach" title="Kirim Gambar"><i class="ph-bold ph-image"></i></button>
            
            <div class="input-wrap">
                <textarea id="chat-input" class="input-box" placeholder="Ketik pesan..." autocomplete="off" rows="1"></textarea>
            </div>
            
            <button type="submit" class="btn-send" id="btn-send" disabled>
                <i class="ph-fill ph-paper-plane-right"></i>
            </button>
        </form>
    </div>

    <!-- LIGHTBOX ZOOM GAMBAR -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="Zoom">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FIREBASE & LOGIC CHAT ROOM -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Ambil ID Ruangan dari URL parameter (contoh: room-chat.html?id=849201)
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');

        if (!roomId) {
            window.location.href = 'ruang-belajar.html';
        }

        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const chatForm = document.getElementById('chat-form');
        const btnSend = document.getElementById('btn-send');
        const btnAttach = document.getElementById('btn-attach');
        const imageInput = document.getElementById('image-input');
        const roomNameEl = document.getElementById('room-name');
        const roomCodeTxt = document.getElementById('room-code-txt');
        const btnRoomInfo = document.getElementById('btn-room-info');

        let currentUser = null;
        let currentUserName = "Pengguna";
        let roomCodeValue = roomId;

        // 1. CEK AUTENTIKASI & NAMA PENGGUNA
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                roomCodeTxt.innerText = `Kode: ${roomId}`;
                
                // Ambil Nama Asli Pengguna dari Firestore
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        currentUserName = (userDoc.data().name || 'Pengguna').split(' ')[0];
                    }
                } catch(e) {}

                // Ambil Info Ruangan
                const roomDoc = await getDoc(doc(db, "rooms", roomId));
                if (roomDoc.exists()) {
                    roomNameEl.innerText = roomDoc.data().name;
                } else {
                    roomNameEl.innerText = "Ruang Diskusi";
                }

                // Mulai Mendengarkan Pesan Real-Time
                listenToMessages();
            } else {
                window.location.href = 'login.html';
            }
        });

        // SALIN KODE RUANGAN KETIKA HEADER DIKETUK
        btnRoomInfo.addEventListener('click', () => {
            navigator.clipboard.writeText(roomId);
            Swal.fire({
                toast: true,
                position: 'top',
                icon: 'success',
                title: `Kode ruangan ${roomId} disalin!`,
                showConfirmButton: false,
                timer: 1500
            });
        });

        // 2. REALTIME LISTENER PESAN DALAM RUANGAN
        function listenToMessages() {
            const msgRef = collection(db, "rooms", roomId, "messages");
            const q = query(msgRef, orderBy("createdAt", "asc"));

            onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = '';
                
                if (snapshot.empty) {
                    chatBox.innerHTML = `
                        <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 0.8rem;">
                            <i class="ph-duotone ph-chat-circle-dots" style="font-size: 3rem; margin-bottom: 6px;"></i><br>
                            Belum ada pesan. Mulai kirim sapaan atau gambar diskusi di sini!
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const msgId = docSnap.id;
                    renderMessageBubble(msgId, msg);
                });

                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        // 3. RENDER BUBBLE CHAT DENGAN OPSI HAPUS & ZOOM GAMBAR
        function renderMessageBubble(msgId, msg) {
            const isOutgoing = msg.senderId === currentUser.uid;
            
            const row = document.createElement('div');
            row.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`;

            const timeStr = msg.createdAt ? new Date(msg.createdAt.toMillis()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Baru saja';

            let imageHtml = '';
            if (msg.imageBase64) {
                imageHtml = `<img src="${msg.imageBase64}" alt="Lampiran" class="chat-img" onclick="openLightbox('${msg.imageBase64}')">`;
            }

            let textHtml = '';
            if (msg.text) {
                textHtml = `<div>${escapeHtml(msg.text).replace(/\n/g, '<br>')}</div>`;
            }

            row.innerHTML = `
                <div class="sender-name">${escapeHtml(msg.senderName)}</div>
                <div class="bubble">
                    ${imageHtml}
                    ${textHtml}
                    <div class="msg-meta">
                        <span>${timeStr}</span>
                        ${isOutgoing ? '<i class="ph-bold ph-checks" style="color:#3b82f6;"></i>' : ''}
                    </div>
                </div>
            `;

            // Fitur Hapus Pesan jika diketuk dan itu pesan milik sendiri
            if (isOutgoing) {
                row.querySelector('.bubble').addEventListener('click', () => {
                    Swal.fire({
                        title: 'Hapus Pesan?',
                        text: 'Pesan ini akan dihapus untuk semua anggota.',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: 'Hapus',
                        cancelButtonText: 'Batal',
                        confirmButtonColor: '#EF4444'
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                await deleteDoc(doc(db, "rooms", roomId, "messages", msgId));
                            } catch(e) {
                                Swal.fire('Error', 'Gagal menghapus pesan.', 'error');
                            }
                        }
                    });
                });
            }

            chatBox.appendChild(row);
        }

        // Fungsionalitas Lightbox Zoom Gambar
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');

        window.openLightbox = function(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
        };

        lightboxClose.addEventListener('click', () => lightbox.classList.remove('active'));
        lightbox.addEventListener('click', (e) => {
            if(e.target === lightbox) lightbox.classList.remove('active');
        });

        // 4. KIRIM GAMBAR (DENGAN KOMPRESOR KANVAS OTOMATIS)
        btnAttach.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Batasi lebar maksimal 800px
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Kompres ke format JPEG kualitas 0.7 agar ukuran Base64 sangat kecil (< 200KB)
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    // Kirim otomatis setelah dipilih
                    sendChatMessage("", compressedBase64);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            imageInput.value = ''; // Reset input file
        });

        // 5. KIRIM PESAN TEKS & KIRIM KE FIRESTORE
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
            btnSend.disabled = chatInput.value.trim() === '';
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';
            btnSend.disabled = true;

            sendChatMessage(text, null);
        });

        async function sendChatMessage(text, imageBase64) {
            try {
                const msgData = {
                    senderId: currentUser.uid,
                    senderName: currentUserName,
                    text: text || "",
                    imageBase64: imageBase64 || null,
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, "rooms", roomId, "messages"), msgData);
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                console.error("Gagal kirim pesan:", error);
                Swal.fire('Gagal', 'Pesan tidak terkirim. Periksa koneksi internet.', 'error');
            }
        }

        // Keamanan XSS Sederhana
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
