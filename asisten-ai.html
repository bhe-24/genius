<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Asisten AI - Genius</title>
    
    <meta name="theme-color" content="#1E3A8A">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --bg-color: #F8FAFC; 
            --header-bg: #FFFFFF; 
            --text-main: #1E293B;
            --text-muted: #64748B;
            --primary: #3B82F6; 
            --primary-hover: #1E3A8A;
            --white: #FFFFFF;
            
            --chat-user: #3B82F6; 
            --chat-ai: #FFFFFF;
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100dvh; 
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; 
        }

        .app-container {
            display: flex; flex-direction: column;
            height: 100%; width: 100%; max-width: 480px;
            margin: 0 auto; background-color: var(--bg-color);
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* HEADER */
        header {
            background-color: var(--header-bg); padding: 14px 20px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: var(--shadow-sm); z-index: 10;
            padding-top: max(14px, env(safe-area-inset-top)); 
            border-bottom: 2px solid var(--primary);
        }

        .back-btn { color: var(--text-main); font-size: 24px; text-decoration: none; display: flex; }

        .ai-profile { display: flex; align-items: center; gap: 10px; }
        .ai-profile .icon {
            width: 38px; height: 38px; background-color: var(--bg-color);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            border: 1px solid #E2E8F0; overflow: hidden; padding: 4px;
        }
        .ai-profile .icon img { width: 100%; height: 100%; object-fit: contain; }

        .ai-profile .info h2 { font-size: 15px; font-weight: 700; color: var(--primary-hover); line-height: 1.2; }
        .ai-profile .info p { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 8px; height: 8px; background-color: #10B981; border-radius: 50%; }

        /* CHAT AREA */
        .chat-area {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
        }

        .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease; }
        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.ai { align-self: flex-start; align-items: flex-start; }

        .bubble { padding: 12px 16px; font-size: 13px; line-height: 1.5; box-shadow: var(--shadow-sm); position: relative; }
        
        .message.user .bubble {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: var(--white); border-radius: 18px 18px 0px 18px;
        }
        .message.ai .bubble {
            background-color: var(--chat-ai); color: var(--text-main);
            border-radius: 18px 18px 18px 0px; border: 1px solid #E2E8F0;
        }

        .time { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

        /* TYPING INDICATOR */
        .typing-indicator {
            display: none; padding: 12px 16px; background-color: var(--chat-ai);
            border-radius: 18px 18px 18px 0px; align-self: flex-start; box-shadow: var(--shadow-sm);
            align-items: center; gap: 4px; width: fit-content; border: 1px solid #E2E8F0;
        }
        .typing-indicator span {
            width: 6px; height: 6px; background-color: var(--primary); border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        /* INPUT AREA */
        .input-area {
            background-color: var(--white); padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            display: flex; align-items: flex-end; gap: 10px;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.05); z-index: 10; border-top: 1px solid #E2E8F0;
        }

        .input-wrapper {
            flex: 1; background-color: var(--bg-color); border-radius: 20px;
            display: flex; align-items: center; padding: 8px 16px; border: 1px solid #E2E8F0; transition: 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

        textarea {
            width: 100%; background: transparent; border: none; outline: none; resize: none; max-height: 100px;
            font-family: 'Poppins', sans-serif; font-size: 14px; color: var(--text-main); padding: 4px 0; line-height: 1.4;
        }
        textarea::placeholder { color: #94A3B8; font-size: 13px; }

        .send-btn {
            background-color: var(--primary); color: var(--white); border: none; width: 45px; height: 45px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px;
            cursor: pointer; transition: 0.3s; flex-shrink: 0; box-shadow: var(--shadow-sm);
        }
        .send-btn:active { transform: scale(0.9); background-color: var(--primary-hover); }
        .send-btn:disabled { background-color: #CBD5E1; cursor: not-allowed; box-shadow: none; }

        .system-message { text-align: center; font-size: 11px; color: var(--text-muted); margin: 10px 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header>
            <a href="index.html" class="back-btn">
                <i class="ph-bold ph-caret-left"></i>
            </a>
            <div class="ai-profile">
                <div class="icon">
                    <!-- LOGO GENIUS -->
                    <img src="https://i.imgur.com/PpxQu9m.png" alt="Genius Logo">
                </div>
                <div class="info">
                    <h2>Genius AI</h2>
                    <p><span class="status-dot" id="status-dot"></span> <span id="status-text">Menyambungkan...</span></p>
                </div>
            </div>
        </header>

        <!-- CHAT BOX -->
        <main class="chat-area" id="chat-box">
            <div class="typing-indicator" id="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        </main>

        <!-- INPUT BOX -->
        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="chat-input" rows="1" placeholder="Ketik pesan atau instruksi..." disabled></textarea>
            </div>
            <button class="send-btn" id="send-btn" disabled>
                <i class="ph-fill ph-paper-plane-right"></i>
            </button>
        </footer>
    </div>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        let currentUser = null;
        let isFetchingFirstTime = true; 

        // Auto-Resize Textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight < 100 ? this.scrollHeight : 100) + 'px';
            sendBtn.disabled = this.value.trim() === '';
        });

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Render Pesan ke Layar
        function appendMessage(sender, text, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('bubble');
            
            // Render text biasa (tanpa parser markdown agar tidak error)
            bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');

            const timeSpan = document.createElement('span');
            timeSpan.classList.add('time');
            
            let timeString = "";
            if (timestamp && timestamp.toDate) {
                const d = timestamp.toDate();
                timeString = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            } else {
                const d = new Date();
                timeString = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            }
            timeSpan.innerText = timeString;

            messageDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(timeSpan);

            chatBox.insertBefore(messageDiv, typingIndicator);
            scrollToBottom();
        }

        // PANTAU LOGIN & TARIK DATA CHAT FIREBASE
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                statusText.innerText = "Online";
                statusDot.style.backgroundColor = "#10B981";
                chatInput.disabled = false;
                
                const qChat = query(collection(db, "users", user.uid, "chats"), orderBy("createdAt", "asc"));
                
                onSnapshot(qChat, (snapshot) => {
                    if (isFetchingFirstTime) {
                        const messages = document.querySelectorAll('.message, .system-message');
                        messages.forEach(msg => msg.remove());
                    }

                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const data = change.doc.data();
                            const sender = data.role === "ai" ? "ai" : "user";
                            appendMessage(sender, data.message || data.text || "[Pesan Kosong]", data.createdAt);
                        }
                    });

                    if (snapshot.empty && isFetchingFirstTime) {
                        const sysMsg = document.createElement('div');
                        sysMsg.classList.add('system-message');
                        sysMsg.innerText = "Sistem siap. Mulai obrolan dengan Genius AI.";
                        chatBox.insertBefore(sysMsg, typingIndicator);
                    }

                    isFetchingFirstTime = false;
                    scrollToBottom();
                });

            } else {
                statusText.innerText = "Sesi Berakhir";
                statusDot.style.backgroundColor = "#EF4444"; 
                chatInput.placeholder = "Silakan login terlebih dahulu.";
                
                const sysMsg = document.createElement('div');
                sysMsg.classList.add('system-message');
                sysMsg.innerText = "Akses ditolak. Anda tidak login ke dalam sistem.";
                chatBox.insertBefore(sysMsg, typingIndicator);
            }
        });

        // FUNGSI KIRIM PESAN KE API VERCEL
        async function sendMessage() {
            const messageText = chatInput.value.trim();
            if (!messageText || !currentUser) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.disabled = true;
            
            // Push pesan User ke Firestore
            const chatRef = collection(db, "users", currentUser.uid, "chats");
            await addDoc(chatRef, {
                role: "user",
                message: messageText,
                createdAt: serverTimestamp()
            });

            // Tampilkan Typing Indicator
            typingIndicator.style.display = 'flex';
            scrollToBottom();

            try {
                // Fetch Asli ke API Chat Vercel
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();

                // Tangkap jika terjadi error dari Backend Vercel
                if (!response.ok) {
                    throw new Error(data.reply || data.error || `HTTP Error ${response.status}`);
                }

                // Push balasan AI ke Firestore
                const aiReply = data.reply || data.message || "Pesan diterima, namun response kosong.";
                await addDoc(chatRef, {
                    role: "ai",
                    message: aiReply,
                    createdAt: serverTimestamp()
                });
                
            } catch (error) {
                console.error("Fetch API Error:", error);
                
                // Menyimpan Error Asli ke database agar terbaca di layar chat
                await addDoc(chatRef, {
                    role: "ai",
                    message: `⚠️ Gagal menghubungi server AI. Pastikan file api/chat.js di Vercel sudah diperbarui. Detail Error: ${error.message}`,
                    createdAt: serverTimestamp()
                });
            } finally {
                typingIndicator.style.display = 'none';
            }
        }

        // Listener Tombol
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                sendMessage();
            }
        });

    </script>
</body>
</html>
