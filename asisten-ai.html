<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Asisten AI - Genius</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        :root {
            /* TEMA GENIUS */
            --primary: #1E3A8A;
            --primary-light: #3B82F6;
            --accent: #3B82F6;
            --accent-dark: #1D4ED8;
            --bg: #E2E8F0;
            --surface: #F8FAFC;
            --border: #E2E8F0;
            --text-primary: #1E293B;
            --text-muted: #64748B;
            --bubble-bot-bg: #FFFFFF;
            --bubble-bot-text: #1E293B;
            --bubble-user-bg: linear-gradient(135deg, var(--primary-light), var(--primary));
            --bubble-user-text: #FFFFFF;
            --radius-bubble: 18px;
            --font: 'Poppins', sans-serif;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 28px rgba(0,0,0,0.12);
            --glass-blur: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: var(--font); background: var(--bg);
            height: 100dvh; width: 100vw; display: flex;
            justify-content: center; align-items: center; overflow: hidden; position: fixed;
        }

        /* ── CONTAINER ── */
        .chat-app {
            width: 100%; max-width: 480px; height: 100%;
            background: var(--surface); display: flex; flex-direction: column;
            overflow: hidden; position: relative; box-shadow: var(--shadow-lg);
        }

        /* ── HEADER ── */
        .chat-header {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.95), rgba(59, 130, 246, 0.95));
            backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            color: white; padding: 14px 18px; display: flex; align-items: center; gap: 12px;
            flex-shrink: 0; position: relative; z-index: 10; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(30, 58, 138, 0.15); padding-top: max(14px, env(safe-area-inset-top));
        }

        .bot-avatar {
            width: 42px; height: 42px; background: var(--surface);
            border: 1.5px solid rgba(255, 255, 255, 0.3); border-radius: 12px;
            display: flex; justify-content: center; align-items: center; padding: 4px;
            flex-shrink: 0; box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2); overflow: hidden;
        }
        .bot-avatar img { width: 100%; height: 100%; object-fit: contain; }

        .header-info { flex: 1; min-width: 0; }
        .header-info h2 { font-size: 1rem; font-weight: 700; line-height: 1.3; }
        .header-info p { font-size: 0.75rem; color: rgba(255, 255, 255, 0.75); display: flex; align-items: center; gap: 5px; }
        
        .online-dot {
            width: 6px; height: 6px; background: #10b981; border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3); } 50% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); } }

        .btn-back {
            color: rgba(255, 255, 255, 0.75); background: none; border: none; font-size: 1.4rem;
            padding: 8px; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
        }
        .btn-back:hover { color: white; transform: translateX(2px); }

        /* ── CHAT BODY ── */
        .chat-body {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px 16px 8px;
            background: var(--surface); display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar { width: 4px; }
        .chat-body::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 0.6); border-radius: 10px; }

        .message-group { display: flex; flex-direction: column; gap: 3px; max-width: 80%; }
        .message-group.group-bot { align-self: flex-start; }
        .message-group.group-user { align-self: flex-end; }

        .bubble {
            padding: 11px 16px; font-size: 0.85rem; line-height: 1.55; word-break: break-word;
            animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.88) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .bubble-bot {
            background: rgba(255, 255, 255, 0.95);
            color: var(--bubble-bot-text); border-radius: 4px var(--radius-bubble) var(--radius-bubble) var(--radius-bubble);
            box-shadow: var(--shadow-md); border: 1px solid rgba(225, 234, 245, 0.8);
        }
        .bubble-user {
            background: var(--bubble-user-bg); color: var(--bubble-user-text);
            border-radius: var(--radius-bubble) 4px var(--radius-bubble) var(--radius-bubble);
            box-shadow: 0 4px 14px rgba(30, 58, 138, 0.25);
        }

        .msg-time { font-size: 0.65rem; color: var(--text-muted); padding: 0 4px; margin-top: 2px; }
        .message-group.group-user .msg-time { text-align: right; }

        /* TYPING INDICATOR */
        .typing-indicator {
            display: none; align-self: flex-start; background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px; border-radius: 4px var(--radius-bubble) var(--radius-bubble) var(--radius-bubble);
            border: 1px solid rgba(225, 234, 245, 0.8); box-shadow: var(--shadow-md); gap: 6px; align-items: center;
        }
        .typing-indicator.visible { display: flex; }

        .dot {
            width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-6px); opacity: 1; } }

        /* ── FOOTER INPUT ── */
        .chat-footer {
            padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.98); border-top: 1px solid rgba(225, 234, 245, 0.8);
            display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
        }

        .input-wrap {
            flex: 1; display: flex; align-items: center; background: var(--bg);
            border: 1.5px solid var(--border); border-radius: 22px; padding: 0 14px; transition: all 0.2s ease; min-height: 44px;
        }
        .input-wrap:focus-within { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12); }

        .input-box {
            flex: 1; border: none; background: transparent; font-size: 0.9rem; font-family: var(--font);
            color: var(--text-primary); resize: none; max-height: 100px; line-height: 1.5; padding: 11px 0; outline: none;
        }

        .btn-send {
            background: var(--blue-gradient); color: white; border: none;
            width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
        }
        .btn-send:active:not(:disabled) { transform: scale(0.94); }
        .btn-send:disabled { background: #cbd5e1; cursor: not-allowed; opacity: 0.6; }

        /* ── EXIT MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 9999; opacity: 0; transition: opacity 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-box {
            background: rgba(255, 255, 255, 0.98); padding: 24px 20px 28px; border-radius: 20px;
            width: 100%; max-width: 340px; text-align: center; box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.15);
            transform: translateY(20px); transition: transform 0.28s ease; border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .modal-overlay.active .modal-box { transform: translateY(0); }

        .modal-icon { font-size: 2.4rem; margin-bottom: 12px; color: var(--blue-dark); }
        .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        .modal-text { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }

        .modal-btns { display: flex; flex-direction: column; gap: 8px; }
        .modal-btn { padding: 12px; border-radius: 12px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        
        .modal-btn-save { background: var(--blue-gradient); color: white; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25); }
        .modal-btn-delete { background: rgba(239, 68, 68, 0.1); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.3); }
        .modal-btn-cancel { background: rgba(203, 213, 225, 0.3); color: #475569; }

        .modal-btn:active { transform: scale(0.97); }

    </style>
</head>
<body>

    <div class="chat-app">
        <!-- HEADER -->
        <div class="chat-header">
            <div class="bot-avatar">
                <img src="https://i.imgur.com/PpxQu9m.png" alt="Genius">
            </div>
            <div class="header-info">
                <h2>Genius AI</h2>
                <p><span class="online-dot" id="status-dot"></span> <span id="status-text">Menyambung...</span></p>
            </div>
            <button class="btn-back" id="btn-open-modal" title="Keluar">
                <i class="ph-bold ph-door-open"></i>
            </button>
        </div>

        <!-- CHAT BODY -->
        <div class="chat-body" id="chat-box">
            <!-- Messages rendered here via Firebase -->
        </div>

        <div class="typing-indicator" id="typing">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>

        <!-- INPUT FORM -->
        <form class="chat-footer" id="chat-form">
            <div class="input-wrap">
                <textarea id="chat-input" class="input-box" placeholder="Ketik instruksi atau /add tugas..." autocomplete="off" rows="1" disabled></textarea>
            </div>
            <button type="submit" class="btn-send" id="btn-send" disabled>
                <i class="ph-fill ph-paper-plane-right"></i>
            </button>
        </form>
    </div>

    <!-- EXIT MODAL -->
    <div id="exit-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon"><i class="ph-duotone ph-sign-out"></i></div>
            <div class="modal-title">Keluar dari Chat?</div>
            <div class="modal-text">Kamu bisa menyimpan percakapan ini atau menghapusnya. <b>Tugas yang sudah di-/add akan tetap aman!</b></div>
            <div class="modal-btns">
                <button class="modal-btn modal-btn-save" id="btn-save-exit">Simpan & Kembali ke Dasbor</button>
                <button class="modal-btn modal-btn-delete" id="btn-delete-exit">Hapus Riwayat Chat & Keluar</button>
                <button class="modal-btn modal-btn-cancel" id="btn-cancel-exit">Batal</button>
            </div>
        </div>
    </div>

    <!-- Script Library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FIREBASE & LOGIKA CHAT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Referensi UI
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const chatForm = document.getElementById('chat-form');
        const btnSend = document.getElementById('btn-send');
        const typingIndicator = document.getElementById('typing');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const exitModal = document.getElementById('exit-modal');

        let currentUser = null;
        let isFetchingFirstTime = true; 

        // ── AUTO RESIZE & ENTER LOGIC ──
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
            btnSend.disabled = chatInput.value.trim() === '';
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function formatTime(ts) {
            const d = ts ? new Date(ts) : new Date();
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        // ── RENDER BUBBLE CHAT ──
        function renderBubble(sender, text, ts) {
            const isBot = sender === 'bot' || sender === 'ai';
            const grp = document.createElement('div');
            grp.className = `message-group ${isBot ? 'group-bot' : 'group-user'}`;

            const bubble = document.createElement('div');
            bubble.className = `bubble ${isBot ? 'bubble-bot' : 'bubble-user'}`;
            
            // PEMBERSIH: Hapus teks proses berpikir bawaan model Qwen
            let cleanText = text;
            if (isBot) {
                cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '');
                cleanText = cleanText.replace(/Here's a thinking process:[\s\S]*?(?=\n\n|\n-|\n[A-Z])/i, '');
            }
            bubble.innerHTML = cleanText.trim().replace(/\n/g, '<br>'); 
            
            grp.appendChild(bubble);

            const time = document.createElement('div');
            time.className = 'msg-time';
            time.textContent = formatTime(ts);
            grp.appendChild(time);

            chatBox.appendChild(grp);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        // ── PANTAU LOGIN & LOAD CHAT ──
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                statusText.innerText = "Online";
                statusDot.style.backgroundColor = "#10B981";
                chatInput.disabled = false;
                
                const qChat = query(collection(db, "users", user.uid, "chats"), orderBy("createdAt", "asc"));
                
                onSnapshot(qChat, (snapshot) => {
                    if (isFetchingFirstTime) chatBox.innerHTML = ''; 

                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const data = change.doc.data();
                            const sender = data.role === "ai" ? "bot" : "user";
                            const timestamp = data.createdAt ? data.createdAt.toMillis() : Date.now();
                            renderBubble(sender, data.message || data.text, timestamp);
                        }
                    });

                    if (snapshot.empty && isFetchingFirstTime) {
                        renderBubble('bot', "Halo! Aku Genius AI.\nKetik **/add [detail tugas]** untuk mengekstrak dan menjadwalkannya otomatis! 🗓️", Date.now());
                    }

                    isFetchingFirstTime = false;
                });

            } else {
                statusText.innerText = "Sesi Berakhir";
                statusDot.style.backgroundColor = "#EF4444"; 
                chatInput.placeholder = "Silakan login terlebih dahulu.";
                renderBubble('bot', 'Akses ditolak. Silakan login terlebih dahulu.', Date.now());
            }
        });

        // ── FUNGSI PERAPI TEKS TUGAS SECARA PINTAR ──
        function formatTaskInput(rawText) {
            let text = rawText.substring(4).trim(); // Buang kata '/add'
            
            // 1. Deteksi Tanggal Sederhana
            let daysToAdd = 1; // Default: Besok
            let timeStr = "Belum disetel";
            
            if (text.toLowerCase().includes('hari ini')) daysToAdd = 0;
            if (text.toLowerCase().includes('lusa')) daysToAdd = 2;
            if (text.toLowerCase().includes('minggu depan')) daysToAdd = 7;

            // 2. Tentukan Tanggal Fix
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + daysToAdd);
            const yyyy = targetDate.getFullYear();
            const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
            const dd = String(targetDate.getDate()).padStart(2, '0');
            const dateKey = `${yyyy}-${mm}-${dd}`;

            // 3. Ekstrak Judul secara Cerdas (Mencari kata setelah "tugas" atau "pr")
            let title = "Tugas Baru";
            const subjectMatch = text.match(/(?:tugas|pr|project)\s+([a-zA-Z0-9]+(?:\s+[a-zA-Z0-9]+)?)/i);
            
            if (subjectMatch && subjectMatch[1]) {
                // Huruf kapital di setiap awal kata judul
                title = "Tugas " + subjectMatch[1].split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            } else {
                // Jika tidak terdeteksi, ambil 2 kata pertama
                title = "Tugas: " + text.split(' ').slice(0, 2).join(' ') + "...";
            }

            // 4. Instruksi dirapikan (Huruf kapital di awal)
            let instruction = text.charAt(0).toUpperCase() + text.slice(1) + ".";

            return { title, instruction, dateKey, time: timeStr };
        }


        // ── PROSES KIRIM CHAT & LOGIKA /ADD TUGAS ──
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !currentUser) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';
            btnSend.disabled = true;

            const chatRef = collection(db, "users", currentUser.uid, "chats");
            await addDoc(chatRef, { role: "user", message: text, createdAt: serverTimestamp() });

            // LOGIKA PENAMBAHAN TUGAS OTOMATIS (YANG SUDAH DIRAPIKAN)
            if (text.toLowerCase().startsWith('/add')) {
                // Panggil fungsi perapi teks
                const taskData = formatTaskInput(text);

                const taskRef = collection(db, "users", currentUser.uid, "tasks");
                await addDoc(taskRef, {
                    title: taskData.title, // Judul rapi (Misal: "Tugas Matematika")
                    instruction: taskData.instruction, // Instruksi utuh dan rapi
                    dateKey: taskData.dateKey, // Tanggal masuk ke Kalender
                    time: taskData.time, 
                    status: "pending", // Masuk ke Home Work
                    createdAt: serverTimestamp()
                });
            }

            chatBox.appendChild(typingIndicator);
            typingIndicator.classList.add('visible');
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }) 
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || data.reply || `HTTP Error ${response.status}`);

                const aiReply = data.reply || "Maaf, pesan kosong.";
                await addDoc(chatRef, { role: "ai", message: aiReply, createdAt: serverTimestamp() });
                
            } catch (error) {
                await addDoc(chatRef, {
                    role: "ai",
                    message: `⚠️ Gagal menghubungi server AI. Detail: ${error.message}`,
                    createdAt: serverTimestamp()
                });
            } finally {
                typingIndicator.classList.remove('visible');
                chatInput.focus();
            }
        });

        // ── LOGIKA MODAL EXIT & DELETE (BEBAS BUG) ──
        document.getElementById('btn-open-modal').addEventListener('click', () => {
            exitModal.classList.add('active');
            chatInput.blur();
        });

        document.getElementById('btn-cancel-exit').addEventListener('click', () => {
            exitModal.classList.remove('active');
        });

        exitModal.addEventListener('click', (e) => {
            if (e.target === exitModal) exitModal.classList.remove('active');
        });

        // TOMBOL: SIMPAN & KELUAR
        document.getElementById('btn-save-exit').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // TOMBOL: HAPUS CHAT & KELUAR
        document.getElementById('btn-delete-exit').addEventListener('click', async () => {
            if (!currentUser) return window.location.href = 'index.html';

            const btnDel = document.getElementById('btn-delete-exit');
            btnDel.innerHTML = '<i class="ph-bold ph-spinner ph-spin"></i> Menghapus...';
            btnDel.disabled = true;

            try {
                // Hanya menghapus isi koleksi 'chats', koleksi 'tasks' dijamin aman!
                const q = query(collection(db, "users", currentUser.uid, "chats"));
                const querySnapshot = await getDocs(q);
                
                const deletePromises = [];
                querySnapshot.forEach((docSnap) => {
                    deletePromises.push(deleteDoc(doc(db, "users", currentUser.uid, "chats", docSnap.id)));
                });

                await Promise.all(deletePromises);
                window.location.href = 'index.html';

            } catch (error) {
                console.error("Gagal menghapus riwayat:", error);
                alert("Gagal menghapus riwayat chat. Periksa koneksi.");
                window.location.href = 'index.html';
            }
        });

    </script>
</body>
</html>
