<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home Work - Genius</title>
    
    <meta name="theme-color" content="#1E3A8A">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        :root {
            --bg-body: #E2E8F0; 
            --bg-app: #F8FAFC;  
            --blue-light: #3B82F6; 
            --blue-dark: #1E3A8A;  
            --blue-gradient: linear-gradient(135deg, var(--blue-light), var(--blue-dark));
            
            --text-main: #1E293B;
            --text-muted: #64748B;
            --white: #FFFFFF;
            --success: #10B981;
            
            --shadow-sm: 0 4px 10px rgba(0,0,0,0.05);
            --border-radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh;}

        .mobile-wrapper {
            width: 100%; max-width: 480px; min-height: 100vh;
            background-color: var(--bg-app); position: relative; overflow-x: hidden;
            display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* HEADER */
        header {
            background-color: var(--white); padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-sm); z-index: 100;
            padding-top: max(16px, env(safe-area-inset-top)); 
            position: sticky; top: 0;
        }

        .header-title { font-size: 16px; font-weight: 700; color: var(--blue-dark); }
        .back-btn { color: var(--text-main); font-size: 24px; cursor: pointer; display: flex; }

        /* VIEW CONTAINERS */
        .view-section {
            flex: 1; padding: 20px; overflow-y: auto;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .hidden-view { display: none !important; }

        /* --- LIST VIEW (DAFTAR KARTU) --- */
        #list-view .section-title { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 15px; }
        
        .hw-card {
            background: var(--white); border-radius: 16px; padding: 16px;
            margin-bottom: 15px; box-shadow: var(--shadow-sm);
            border-left: 5px solid var(--blue-light);
            cursor: pointer; transition: transform 0.2s;
        }
        .hw-card:active { transform: scale(0.97); }

        .hw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .hw-code { font-size: 11px; font-weight: 600; color: var(--blue-light); background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 6px; letter-spacing: 0.5px;}
        .hw-deadline { font-size: 11px; color: #EF4444; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        
        .hw-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--blue-dark); }
        .hw-card p { font-size: 12px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* --- DETAIL VIEW (REFERENCE CARD) --- */
        #detail-view { background-color: var(--white); }
        
        .detail-code { text-align: center; font-size: 14px; font-weight: 700; color: var(--blue-light); margin-bottom: 15px; letter-spacing: 1px; }
        .detail-title { font-size: 20px; font-weight: 700; color: var(--blue-dark); margin-bottom: 10px; line-height: 1.3; }
        
        .instruction-box { background-color: var(--bg-app); padding: 15px; border-radius: 12px; font-size: 13px; color: var(--text-main); margin-bottom: 20px; border: 1px solid #E2E8F0; line-height: 1.6; }
        .instruction-box h4 { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }

        textarea {
            width: 100%; min-height: 120px; padding: 12px; font-size: 14px;
            border-radius: 12px; border: 1.5px solid #E2E8F0; background: var(--bg-app);
            font-family: 'Poppins', sans-serif; resize: vertical; transition: 0.3s;
        }
        textarea:focus { outline: none; border-color: var(--blue-light); background: var(--white); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

        .btn-ai {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9); color: var(--white);
            border: none; padding: 10px 15px; border-radius: 10px; font-size: 12px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.2);
            transition: 0.3s;
        }
        .btn-ai:active { transform: scale(0.97); }
        .btn-ai:disabled { background: #A78BFA; cursor: not-allowed; box-shadow: none; }
        
        .ai-response-box {
            display: none; background-color: #F5F3FF; padding: 15px; border-radius: 12px;
            border: 1px dashed #8B5CF6; font-size: 13px; margin-bottom: 20px;
            line-height: 1.6;
        }
        .ai-response-box strong { color: #6D28D9; display: block; margin-bottom: 8px; }

        .upload-area {
            border: 2px dashed #CBD5E1; border-radius: 12px; padding: 20px;
            text-align: center; cursor: pointer; transition: 0.3s; position: relative;
        }
        .upload-area:hover { border-color: var(--blue-light); background: rgba(59,130,246,0.02); }
        .upload-area input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-area i { font-size: 32px; color: var(--blue-light); margin-bottom: 10px; }
        .upload-area p { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        
        .preview-container { display: none; margin-top: 15px; text-align: center; }
        .preview-container img { max-width: 100%; border-radius: 10px; box-shadow: var(--shadow-sm); border: 1px solid #E2E8F0; }

        .btn-finish {
            background: var(--success); color: var(--white); width: 100%;
            padding: 14px; border: none; border-radius: 30px; font-size: 15px;
            font-weight: 700; cursor: pointer; margin-top: 30px; margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); display: none; 
            animation: fadeInUp 0.4s ease;
        }
        .btn-finish:active { transform: scale(0.97); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 60px; color: #CBD5E1; margin-bottom: 15px; }
        .empty-state h3 { font-size: 16px; color: var(--blue-dark); margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="mobile-wrapper">
        
        <!-- HEADER -->
        <header>
            <div class="back-btn" id="btn-back" onclick="window.location.href='index.html'">
                <i class="ph-bold ph-caret-left"></i>
            </div>
            <div class="header-title" id="header-title">Home Work</div>
            <div style="width: 24px;"></div>
        </header>

        <!-- VIEW 1: DAFTAR TUGAS -->
        <div id="list-view" class="view-section">
            <div class="section-title">Tugas Tertunda (Pending)</div>
            <div id="hw-list-container">
                <!-- Kartu Tugas Akan Dirender Di Sini Secara Realtime -->
                <div class="empty-state">
                    <i class="ph-bold ph-spinner ph-spin"></i>
                    <p>Memuat data tugas...</p>
                </div>
            </div>
        </div>

        <!-- VIEW 2: DETAIL TUGAS & FORM PENGERJAAN -->
        <div id="detail-view" class="view-section hidden-view">
            <div class="detail-code" id="det-code">#HW-XXXX</div>
            <h2 class="detail-title" id="det-title">Judul Tugas</h2>
            
            <div class="instruction-box">
                <h4>Instruksi / Pertanyaan:</h4>
                <p id="det-instruction">Deskripsi instruksi akan muncul di sini...</p>
            </div>

            <!-- Tombol Bantuan AI Baru -->
            <button class="btn-ai" id="btn-ai" onclick="getAIHelp()">
                <i class="ph-fill ph-magic-wand"></i> Minta Rekomendasi Jawaban AI
            </button>
            
            <!-- Kotak Respons AI -->
            <div class="ai-response-box" id="ai-response">
                <strong><i class="ph-fill ph-robot"></i> Rekomendasi Genius AI:</strong>
                <span id="ai-text">Memproses jawaban...</span>
            </div>

            <div class="form-group">
                <label>Jawaban Langsung</label>
                <textarea id="answer-text" placeholder="Ketik jawabanmu di sini jika tidak menggunakan file..." oninput="checkCompletion()"></textarea>
            </div>

            <div class="form-group">
                <label>Upload Bukti / Berkas (Wajib jika tidak ada teks)</label>
                <div class="upload-area">
                    <i class="ph-duotone ph-upload-simple"></i>
                    <p id="upload-label">Ketuk untuk upload gambar tugas/screenshot Drive</p>
                    <input type="file" id="file-upload" accept="image/*" onchange="handleFileUpload(event)">
                </div>
                <div class="preview-container" id="preview-container">
                    <img id="image-preview" src="" alt="Preview">
                </div>
            </div>

            <button class="btn-finish" id="btn-finish" onclick="submitTaskToFirebase()">
                <i class="ph-bold ph-check-circle"></i> Selesaikan Tugas
            </button>
        </div>

    </div>

    <!-- Script Library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let pendingTasks = []; 
        let currentActiveTaskId = null;
        let currentBase64Image = null;

        // Element UI
        const listView = document.getElementById('list-view');
        const detailView = document.getElementById('detail-view');
        const btnBack = document.getElementById('btn-back');
        const headerTitle = document.getElementById('header-title');
        
        const btnFinish = document.getElementById('btn-finish');
        const answerText = document.getElementById('answer-text');
        const fileUpload = document.getElementById('file-upload');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const uploadLabel = document.getElementById('upload-label');
        
        // Element AI
        const aiResponseBox = document.getElementById('ai-response');
        const aiText = document.getElementById('ai-text');
        const btnAI = document.getElementById('btn-ai');

        // ==========================================
        // 1. PANTAU LOGIN & TARIK DATA REALTIME
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                
                const q = query(collection(db, "users", user.uid, "tasks"), where("status", "==", "pending"));
                
                onSnapshot(q, (snapshot) => {
                    pendingTasks = [];
                    snapshot.forEach(doc => {
                        pendingTasks.push({ id: doc.id, ...doc.data() });
                    });
                    renderTaskList();
                });

            } else {
                document.getElementById('hw-list-container').innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-lock-key"></i>
                        <h3>Akses Terbatas</h3>
                        <p style="font-size: 13px;">Silakan masuk (login) terlebih dahulu untuk melihat dan mengerjakan tugas.</p>
                    </div>
                `;
            }
        });

        // ==========================================
        // 2. RENDER DAFTAR KARTU TUGAS
        // ==========================================
        function renderTaskList() {
            const container = document.getElementById('hw-list-container');
            container.innerHTML = '';

            if (pendingTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-check-circle" style="color: #10B981;"></i>
                        <h3 style="color: #10B981;">Semua Selesai!</h3>
                        <p style="font-size: 13px;">Hebat, tidak ada tugas yang tertunda. Kamu bisa bersantai sekarang.</p>
                    </div>
                `;
                return;
            }

            pendingTasks.forEach(task => {
                const card = document.createElement('div');
                card.classList.add('hw-card');
                card.onclick = () => openTaskDetail(task.id);
                
                const uniqueCode = task.code || `#HW-${task.id.substring(0,5).toUpperCase()}`;
                const deadlineText = task.time || task.deadline || "Belum ada tenggat";
                const titleText = task.title || "Tugas Tanpa Judul";
                const instructionText = task.instruction || "Tidak ada detail instruksi yang dilampirkan.";

                card.innerHTML = `
                    <div class="hw-header">
                        <span class="hw-code">${uniqueCode}</span>
                        <span class="hw-deadline"><i class="ph-fill ph-warning-circle"></i> ${deadlineText}</span>
                    </div>
                    <h3>${titleText}</h3>
                    <p>${instructionText}</p>
                `;
                container.appendChild(card);
            });
        }

        // ==========================================
        // 3. LOGIKA MEMBUKA DETAIL
        // ==========================================
        window.openTaskDetail = (taskId) => {
            const task = pendingTasks.find(t => t.id === taskId);
            if (!task) return;

            currentActiveTaskId = task.id;
            const uniqueCode = task.code || `#HW-${task.id.substring(0,5).toUpperCase()}`;

            document.getElementById('det-code').innerText = uniqueCode;
            document.getElementById('det-title').innerText = task.title || "Tugas Tanpa Judul";
            document.getElementById('det-instruction').innerText = task.instruction || "Tidak ada detail instruksi.";

            // Reset Form & AI Box
            answerText.value = '';
            fileUpload.value = '';
            currentBase64Image = null;
            previewContainer.style.display = 'none';
            imagePreview.src = '';
            uploadLabel.innerText = "Ketuk untuk upload gambar tugas/screenshot Drive";
            btnFinish.style.display = 'none';
            
            aiResponseBox.style.display = 'none';
            aiText.innerText = 'Memproses jawaban...';
            btnAI.innerHTML = `<i class="ph-fill ph-magic-wand"></i> Minta Rekomendasi Jawaban AI`;
            btnAI.style.background = "linear-gradient(135deg, #8B5CF6, #6D28D9)";
            btnAI.disabled = false;

            // Ubah Header & Layar
            headerTitle.innerText = "Ruang Kerja";
            btnBack.onclick = closeTaskDetail; 
            
            listView.classList.add('hidden-view');
            detailView.classList.remove('hidden-view');
        };

        window.closeTaskDetail = () => {
            currentActiveTaskId = null;
            headerTitle.innerText = "Home Work";
            btnBack.onclick = () => window.location.href = 'index.html'; 
            
            detailView.classList.add('hidden-view');
            listView.classList.remove('hidden-view');
        };

        // ==========================================
        // 4. LOGIKA BANTUAN AI (FETCH KE /api/brain)
        // ==========================================
        window.getAIHelp = async () => {
            // Ambil data untuk dikirim ke AI
            const taskTitle = document.getElementById('det-title').innerText;
            const taskInstruction = document.getElementById('det-instruction').innerText;

            btnAI.innerHTML = `<i class="ph-bold ph-spinner ph-spin"></i> Genius AI sedang berpikir...`;
            btnAI.disabled = true;
            aiResponseBox.style.display = 'none'; 

            try {
                // Fetch ke API Brain Vercel
                const response = await fetch('/api/brain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: taskTitle,
                        instruction: taskInstruction
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.reply || "Gagal mendapatkan respons AI.");
                }

                // Tampilkan respons AI dengan memformat newline menjadi <br> agar rapi
                aiResponseBox.style.display = 'block';
                aiText.innerHTML = (data.reply || "Maaf, AI tidak merespon.").replace(/\n/g, '<br>');

                btnAI.innerHTML = `<i class="ph-fill ph-check-circle"></i> Jawaban Berhasil Dimuat`;
                btnAI.style.background = "#10B981"; // Ubah tombol jadi hijau sukses

            } catch (error) {
                console.error("AI Help Error:", error);
                aiResponseBox.style.display = 'block';
                aiText.innerHTML = `<span style="color:#EF4444;">⚠️ Gagal: ${error.message}</span>`;

                btnAI.innerHTML = `<i class="ph-fill ph-warning-circle"></i> Gagal Meminta Bantuan`;
                btnAI.style.background = "#EF4444";
                btnAI.disabled = false; // Boleh dicoba lagi
            }
        };

        // ==========================================
        // 5. UPLOAD GAMBAR (BASE64)
        // ==========================================
        window.handleFileUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                Swal.fire({ icon: 'warning', title: 'File Terlalu Besar', text: 'Maksimal 5MB.' });
                fileUpload.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onloadend = function () {
                currentBase64Image = reader.result; 
                
                uploadLabel.innerText = "Gambar berhasil dimuat (" + file.name + ")";
                imagePreview.src = currentBase64Image;
                previewContainer.style.display = 'block';

                window.checkCompletion(); 
            };
            reader.readAsDataURL(file);
        };

        window.checkCompletion = () => {
            const isTextFilled = answerText.value.trim().length > 0;
            const isImageUploaded = currentBase64Image !== null;

            if (isTextFilled || isImageUploaded) {
                btnFinish.style.display = 'block';
            } else {
                btnFinish.style.display = 'none';
            }
        };

        // ==========================================
        // 6. SUBMIT TUGAS KE FIREBASE
        // ==========================================
        window.submitTaskToFirebase = async () => {
            if (!currentActiveTaskId || !currentUser) return;

            const result = await Swal.fire({
                title: 'Kumpulkan Tugas?',
                text: "Tugas ini akan diselesaikan dan dipindahkan ke Arsip.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10B981',
                cancelButtonColor: '#64748B',
                confirmButtonText: 'Ya, Selesaikan!'
            });

            if (result.isConfirmed) {
                const originalBtnHtml = btnFinish.innerHTML;
                btnFinish.innerHTML = `<i class="ph-bold ph-spinner ph-spin"></i> Menyimpan Data...`;
                btnFinish.disabled = true;

                try {
                    const taskRef = doc(db, "users", currentUser.uid, "tasks", currentActiveTaskId);
                    await updateDoc(taskRef, {
                        status: "completed",
                        answerText: answerText.value.trim(),
                        base64Image: currentBase64Image, 
                        completedAt: serverTimestamp()
                    });

                    const userRef = doc(db, "users", currentUser.uid);
                    await updateDoc(userRef, {
                        tasksDone: increment(1),
                        score: increment(0.25)
                    });

                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: 'Tugas telah dikumpulkan dan Skor Genius Anda bertambah.',
                        confirmButtonColor: '#3B82F6',
                        timer: 2000,
                        showConfirmButton: false
                    });

                    window.closeTaskDetail();

                } catch (error) {
                    console.error("Gagal update task:", error);
                    Swal.fire('Error', 'Gagal mengirim tugas: ' + error.message, 'error');
                } finally {
                    btnFinish.innerHTML = originalBtnHtml;
                    btnFinish.disabled = false;
                }
            }
        };
    </script>
</body>
</html>
