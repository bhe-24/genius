<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalender - Genius</title>
    
    <meta name="theme-color" content="#1E3A8A">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --bg-body: #E2E8F0; 
            --bg-app: #F8FAFC;  
            --blue-light: #3B82F6; 
            --blue-dark: #1E3A8A;  
            --blue-gradient: linear-gradient(135deg, var(--blue-light), var(--blue-dark));
            
            --text-main: #1E293B;
            --text-muted: #64748B;
            --white: #FFFFFF;
            
            --shadow-sm: 0 4px 10px rgba(0,0,0,0.05);
            --border-radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

        .mobile-wrapper {
            width: 100%; max-width: 480px; min-height: 100vh;
            background-color: var(--bg-app); position: relative; overflow-x: hidden;
            display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* HEADER */
        header {
            background-color: var(--white); padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-sm); z-index: 100;
            padding-top: max(16px, env(safe-area-inset-top)); 
            position: sticky; top: 0;
        }

        .header-title { font-size: 16px; font-weight: 700; color: var(--blue-dark); display: flex; align-items: center; gap: 6px; }
        .back-btn { color: var(--text-main); font-size: 24px; cursor: pointer; display: flex; text-decoration: none; }

        /* CALENDAR SECTION */
        .calendar-section {
            background-color: var(--white);
            border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
            box-shadow: var(--shadow-sm); padding: 20px; z-index: 5;
            border-bottom: 2px solid #E2E8F0;
        }

        .calendar-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }

        .calendar-header button {
            background: rgba(59, 130, 246, 0.1); border: none; font-size: 20px; color: var(--blue-dark);
            cursor: pointer; padding: 6px 12px; border-radius: 12px; transition: 0.2s; display: flex;
        }
        .calendar-header button:active { transform: scale(0.9); background: var(--blue-light); color: white; }

        .calendar-header h2 { font-size: 16px; font-weight: 700; color: var(--blue-dark); letter-spacing: 0.5px; }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }

        .day-cell {
            aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 14px; font-weight: 500; border-radius: 50%; cursor: pointer; position: relative; transition: all 0.2s ease;
        }
        .day-cell:active { transform: scale(0.9); }
        .day-cell.empty { cursor: default; }
        
        .day-cell.today { background-color: rgba(59, 130, 246, 0.15); color: var(--blue-dark); font-weight: 700; border: 1.5px solid var(--blue-light); }
        .day-cell.selected { background: var(--blue-gradient); color: var(--white); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); border: none; }

        /* DOT INDICATOR (Tugas) */
        .task-dots { display: flex; gap: 3px; position: absolute; bottom: 5px; }
        .dot { width: 5px; height: 5px; background-color: #F59E0B; border-radius: 50%; }
        .day-cell.selected .dot { background-color: var(--white); } /* Ubah putih jika sel aktif */

        /* TASKS LIST SECTION */
        .task-section { flex: 1; padding: 20px; overflow-y: auto; background-color: var(--bg-app); }
        
        .task-section-header { font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }

        /* TASK CARD */
        .task-card {
            background-color: var(--white); border-radius: 16px; padding: 16px;
            display: flex; align-items: center; gap: 15px; box-shadow: var(--shadow-sm);
            border: 1px solid #E2E8F0; cursor: pointer; transition: 0.2s;
        }
        .task-card:active { transform: scale(0.97); }

        .task-icon {
            width: 46px; height: 46px; border-radius: 14px; display: flex; justify-content: center;
            align-items: center; font-size: 24px; flex-shrink: 0; background-color: rgba(59, 130, 246, 0.1); color: var(--blue-light);
        }

        .task-info { flex: 1; overflow: hidden; }
        .task-info h3 { font-size: 14px; font-weight: 700; color: var(--blue-dark); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .task-info p { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        
        .task-action { color: var(--text-muted); font-size: 20px; display: flex; }

        /* EMPTY STATE / LOADING */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; color: #CBD5E1; margin-bottom: 10px; }
        .empty-state p { font-size: 13px; line-height: 1.5; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="mobile-wrapper">
        
        <!-- HEADER -->
        <header>
            <a href="index.html" class="back-btn">
                <i class="ph-bold ph-caret-left"></i>
            </a>
            <div class="header-title">
                <i class="ph-fill ph-calendar-check"></i> Kalender Tugas
            </div>
            <div style="width: 24px;"></div>
        </header>

        <!-- CALENDAR -->
        <div class="calendar-section">
            <div class="calendar-header">
                <button id="prev-month"><i class="ph-bold ph-caret-left"></i></button>
                <h2 id="month-year-display">Memuat...</h2>
                <button id="next-month"><i class="ph-bold ph-caret-right"></i></button>
            </div>
            
            <div class="weekdays">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>
            
            <div class="days-grid" id="calendar-days">
                <!-- Sel akan dirender JS -->
            </div>
        </div>

        <!-- TASK LIST -->
        <div class="task-section">
            <div class="task-section-header">
                <span id="selected-date-text">Memuat jadwal...</span>
            </div>
            
            <div class="task-list" id="task-list-container">
                <div class="empty-state">
                    <i class="ph-bold ph-spinner ph-spin"></i>
                    <p>Menyinkronkan data dengan server...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DATA PENYIMPANAN TUGAS REAL DARI FIREBASE
        let realTasks = {}; 
        let currentUser = null;

        // VARIABEL KALENDER
        let currentDate = new Date(); 
        let selectedDate = new Date(); 

        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        
        const monthYearDisplay = document.getElementById('month-year-display');
        const calendarDays = document.getElementById('calendar-days');
        const taskListContainer = document.getElementById('task-list-container');
        const selectedDateText = document.getElementById('selected-date-text');

        // 1. PANTAU LOGIN USER & TARIK DATA TUGAS
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                listenToTasks(user.uid);
            } else {
                // Jika belum login, kosongkan kalender dan minta login
                realTasks = {};
                renderCalendar();
                taskListContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-lock-key"></i>
                        <p>Silakan masuk (login) terlebih dahulu untuk melihat kalender jadwalmu.</p>
                    </div>
                `;
            }
        });

        // 2. FUNGSI TARIK DATA TUGAS DARI FIRESTORE (REAL-TIME)
        function listenToTasks(uid) {
            // Kita tarik tugas yang statusnya belum selesai (pending)
            const q = query(collection(db, "users", uid, "tasks"), where("status", "==", "pending"));
            
            onSnapshot(q, (snapshot) => {
                realTasks = {}; // Reset agar tidak duplikat saat ada perubahan
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // ASUMSI: Data di database punya field dateKey format "YYYY-MM-DD"
                    // Contoh: { title: "Matematika", dateKey: "2026-08-18", time: "10:00" }
                    const dateKey = data.dateKey; 
                    
                    if (dateKey) {
                        if (!realTasks[dateKey]) realTasks[dateKey] = [];
                        realTasks[dateKey].push({ id: doc.id, ...data });
                    }
                });

                renderCalendar();
                
                // Tampilkan tugas untuk tanggal yang saat ini sedang dipilih
                const selYear = selectedDate.getFullYear();
                const selMonth = String(selectedDate.getMonth() + 1).padStart(2, '0');
                const selDay = String(selectedDate.getDate()).padStart(2, '0');
                showTasksForDate(`${selYear}-${selMonth}-${selDay}`, selectedDate.getDate(), monthNames[selectedDate.getMonth()], selYear);
            });
        }

        // 3. FUNGSI RENDER TAMPILAN KALENDER
        function renderCalendar() {
            calendarDays.innerHTML = "";
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearDisplay.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // Render sel kosong
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-cell', 'empty');
                calendarDays.appendChild(emptyCell);
            }

            // Render tanggal asli
            for (let i = 1; i <= lastDay; i++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                dayCell.innerText = i;

                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayCell.classList.add('today');
                }

                if (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear()) {
                    dayCell.classList.add('selected');
                }

                // Cek apakah ada tugas nyata di Firebase pada tanggal ini
                if (realTasks[dateString] && realTasks[dateString].length > 0) {
                    const dotsContainer = document.createElement('div');
                    dotsContainer.classList.add('task-dots');
                    
                    const maxDots = Math.min(realTasks[dateString].length, 3);
                    for (let d = 0; d < maxDots; d++) {
                        const dot = document.createElement('div');
                        dot.classList.add('dot');
                        dotsContainer.appendChild(dot);
                    }
                    dayCell.appendChild(dotsContainer);
                }

                dayCell.addEventListener('click', () => {
                    selectedDate = new Date(year, month, i);
                    renderCalendar(); 
                    showTasksForDate(dateString, i, monthNames[month], year);
                });

                calendarDays.appendChild(dayCell);
            }
        }

        // 4. FUNGSI MENAMPILKAN DAFTAR TUGAS SAAT TANGGAL DIKLIK
        function showTasksForDate(dateString, day, monthName, year) {
            selectedDateText.innerText = `Jadwal pada ${day} ${monthName} ${year}`;
            taskListContainer.innerHTML = ""; 

            const tasks = realTasks[dateString];

            if (tasks && tasks.length > 0) {
                tasks.forEach(task => {
                    const card = document.createElement('a');
                    card.href = `home-work.html?id=${task.id}`; // Navigasi ke halaman detail tugas
                    card.classList.add('task-card');
                    
                    // Gunakan ikon default jika di database tidak diset
                    const iconClass = task.icon || "ph-file-text";
                    const timeText = task.time || "Sepanjang hari";
                    const titleText = task.title || "Tugas Tanpa Judul";
                    
                    card.innerHTML = `
                        <div class="task-icon"><i class="ph-duotone ${iconClass}"></i></div>
                        <div class="task-info">
                            <h3>${titleText}</h3>
                            <p><i class="ph-bold ph-clock"></i> ${timeText}</p>
                        </div>
                        <div class="task-action"><i class="ph-bold ph-caret-right"></i></div>
                    `;
                    taskListContainer.appendChild(card);
                });
            } else {
                taskListContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-coffee"></i>
                        <p>Kosong.<br>Tidak ada jadwal atau tugas di hari ini.</p>
                    </div>
                `;
            }
        }

        // 5. TOMBOL NAVIGASI BULAN
        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

    </script>
</body>
</html>
