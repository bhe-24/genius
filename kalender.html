<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalender - Genius</title>
    
    <meta name="theme-color" content="#1E3A8A">
    <!-- FAVICON & PWA SETTINGS -->
    <link rel="icon" href="https://i.imgur.com/PpxQu9m.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Genius">
    <link rel="apple-touch-icon" href="https://i.imgur.com/PpxQu9m.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- ONESIGNAL PUSH NOTIFICATION -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "ecc3da18-8ac0-43ab-8346-fca21f11fa07",
        });
      });
    </script>

    <style>
        :root {
            --bg-body: #E2E8F0; 
            --bg-app: #F8FAFC;  
            --blue-light: #3B82F6; 
            --blue-dark: #1E3A8A;  
            --blue-gradient: linear-gradient(135deg, var(--blue-light), var(--blue-dark));
            
            --text-main: #1E293B;
            --text-muted: #64748B;
            --white: #FFFFFF;
            
            --shadow-sm: 0 4px 10px rgba(0,0,0,0.05);
            --border-radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

        .mobile-wrapper {
            width: 100%; max-width: 480px; min-height: 100vh;
            background-color: var(--bg-app); position: relative; overflow-x: hidden;
            display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* HEADER */
        header {
            background-color: var(--white); padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-sm); z-index: 100;
            padding-top: max(16px, env(safe-area-inset-top)); 
            position: sticky; top: 0;
        }

        .header-title { font-size: 16px; font-weight: 700; color: var(--blue-dark); display: flex; align-items: center; gap: 6px; }
        .back-btn { color: var(--text-main); font-size: 24px; cursor: pointer; display: flex; text-decoration: none; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); }

        /* --- SKELETON SHIMMER EFFECT --- */
        .skeleton-box {
            position: relative; overflow: hidden; background-color: #E2E8F0; border-radius: 8px;
        }
        .skeleton-box::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg, rgba(255,255,255, 0) 0, rgba(255,255,255, 0.8) 20%, rgba(255,255,255, 0) 40%);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* CALENDAR SECTION */
        .calendar-section {
            background-color: var(--white);
            border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
            box-shadow: var(--shadow-sm); padding: 20px; z-index: 5;
            border-bottom: 2px solid #E2E8F0;
        }

        .calendar-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }

        .calendar-header button {
            background: rgba(59, 130, 246, 0.1); border: none; font-size: 20px; color: var(--blue-dark);
            cursor: pointer; padding: 6px 12px; border-radius: 12px; transition: 0.2s; display: flex;
        }
        .calendar-header button:active { transform: scale(0.9); background: var(--blue-light); color: white; }

        .calendar-header h2 { font-size: 16px; font-weight: 700; color: var(--blue-dark); letter-spacing: 0.5px; }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }

        .day-cell {
            aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 14px; font-weight: 500; border-radius: 50%; cursor: pointer; position: relative; transition: all 0.2s ease;
        }
        .day-cell:active { transform: scale(0.9); }
        .day-cell.empty { cursor: default; }
        
        .day-cell.today { background-color: rgba(59, 130, 246, 0.15); color: var(--blue-dark); font-weight: 700; border: 1.5px solid var(--blue-light); }
        .day-cell.selected { background: var(--blue-gradient); color: var(--white); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); border: none; }

        /* DOT INDICATOR (Tugas) */
        .task-dots { display: flex; gap: 3px; position: absolute; bottom: 5px; }
        .dot { width: 5px; height: 5px; background-color: #F59E0B; border-radius: 50%; }
        .day-cell.selected .dot { background-color: var(--white); }

        /* TASKS LIST SECTION */
        .task-section { flex: 1; padding: 20px; overflow-y: auto; background-color: var(--bg-app); }
        
        .task-section-header { font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }

        /* TASK CARD */
        .task-card {
            background-color: var(--white); border-radius: 16px; padding: 16px;
            display: flex; align-items: center; gap: 15px; box-shadow: var(--shadow-sm);
            border: 1px solid #E2E8F0; cursor: pointer; transition: 0.2s; text-decoration: none;
        }
        .task-card:active { transform: scale(0.97); }

        .task-icon {
            width: 46px; height: 46px; border-radius: 14px; display: flex; justify-content: center;
            align-items: center; font-size: 24px; flex-shrink: 0; background-color: rgba(59, 130, 246, 0.1); color: var(--blue-light);
        }

        .task-info { flex: 1; overflow: hidden; }
        .task-info h3 { font-size: 14px; font-weight: 700; color: var(--blue-dark); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .task-info p { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        
        .task-action { color: var(--text-muted); font-size: 20px; display: flex; }

        /* EMPTY STATE / LOADING */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; color: #CBD5E1; margin-bottom: 10px; }
        .empty-state p { font-size: 13px; line-height: 1.5; }

    </style>
</head>
<body>

    <div class="mobile-wrapper">
        
        <!-- HEADER -->
        <header>
            <a href="index.html" class="back-btn">
                <i class="ph-bold ph-caret-left"></i>
            </a>
            <div class="header-title">
                <i class="ph-fill ph-calendar-check"></i> Kalender Tugas
            </div>
            <div style="width: 24px;"></div>
        </header>

        <!-- ============================================== -->
        <!-- SKELETON VIEW (Tampil saat memuat data) -->
        <!-- ============================================== -->
        <main id="skeleton-view" style="flex:1; display:flex; flex-direction:column;">
            <div class="calendar-section">
                <div class="calendar-header">
                    <div class="skeleton-box" style="width: 30px; height: 30px; border-radius: 8px;"></div>
                    <div class="skeleton-box" style="width: 120px; height: 20px; border-radius: 4px;"></div>
                    <div class="skeleton-box" style="width: 30px; height: 30px; border-radius: 8px;"></div>
                </div>
                <div class="weekdays">
                    <div class="skeleton-box" style="height:12px; margin: 0 4px;"></div>
                    <div class="skeleton-box" style="height:12px; margin: 0 4px;"></div>
                    <div class="skeleton-box" style="height:12px; margin: 0 4px;"></div>
                    <div class="skeleton-box" style="height:12px; margin: 0 4px;"></div>
                    <div class="skeleton-box" style="height:12px; margin: 0 4px;"></div>
                    <div class="skeleton-box" style="height:12px; margin: 0 4px;"></div>
                    <div class="skeleton-box" style="height:12px; margin: 0 4px;"></div>
                </div>
                <div class="days-grid">
                    <script>
                        for(let i=0; i<35; i++){
                            document.write('<div class="skeleton-box" style="aspect-ratio:1; border-radius:50%;"></div>');
                        }
                    </script>
                </div>
            </div>
            
            <div class="task-section">
                <div class="skeleton-box" style="width: 150px; height: 18px; margin-bottom: 15px;"></div>
                <div class="task-list">
                    <div class="skeleton-box" style="height: 80px; border-radius: 16px;"></div>
                    <div class="skeleton-box" style="height: 80px; border-radius: 16px;"></div>
                </div>
            </div>
        </main>

        <!-- ============================================== -->
        <!-- KONTEN ASLI (Tampil setelah data ditarik) -->
        <!-- ============================================== -->
        <main id="real-content" style="flex:1; display:none; flex-direction:column;">
            <!-- CALENDAR -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <button id="prev-month"><i class="ph-bold ph-caret-left"></i></button>
                    <h2 id="month-year-display">Memuat...</h2>
                    <button id="next-month"><i class="ph-bold ph-caret-right"></i></button>
                </div>
                
                <div class="weekdays">
                    <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
                </div>
                
                <div class="days-grid" id="calendar-days">
                    <!-- Sel dirender JS -->
                </div>
            </div>

            <!-- TASK LIST -->
            <div class="task-section">
                <div class="task-section-header">
                    <span id="selected-date-text">Memilih jadwal...</span>
                </div>
                
                <div class="task-list" id="task-list-container">
                    <!-- Daftar tugas -->
                </div>
            </div>
        </main>

    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const skeletonView = document.getElementById('skeleton-view');
        const realContent = document.getElementById('real-content');

        // DATA PENYIMPANAN
        let realTasks = {}; 
        let currentUser = null;

        let currentDate = new Date(); 
        let selectedDate = new Date(); 

        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        
        const monthYearDisplay = document.getElementById('month-year-display');
        const calendarDays = document.getElementById('calendar-days');
        const taskListContainer = document.getElementById('task-list-container');
        const selectedDateText = document.getElementById('selected-date-text');

        // CACHE NOTIFIKASI AGAR TIDAK SPAM
        const NOTIFIED_CACHE_KEY = 'genius_notified_tasks';
        let notifiedTasks = JSON.parse(localStorage.getItem(NOTIFIED_CACHE_KEY) || '{}');

        function hideSkeleton() {
            skeletonView.style.display = 'none';
            realContent.style.display = 'flex';
        }

        // Minta Izin Notifikasi Asli
        function requestNativeNotification() {
            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
        }

        // 1. PANTAU LOGIN USER
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                requestNativeNotification();
                listenToTasks(user.uid);
            } else {
                realTasks = {};
                renderCalendar();
                taskListContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-lock-key"></i>
                        <p>Silakan masuk (login) terlebih dahulu untuk melihat kalender jadwalmu.</p>
                    </div>
                `;
                hideSkeleton();
            }
        });

        // 2. FUNGSI TARIK DATA (REAL-TIME)
        function listenToTasks(uid) {
            const q = query(collection(db, "users", uid, "tasks"), where("status", "==", "pending"));
            
            onSnapshot(q, (snapshot) => {
                realTasks = {}; 
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const dateKey = data.dateKey; 
                    
                    if (dateKey) {
                        if (!realTasks[dateKey]) realTasks[dateKey] = [];
                        realTasks[dateKey].push({ id: doc.id, ...data });
                    }
                });

                renderCalendar();
                
                const selYear = selectedDate.getFullYear();
                const selMonth = String(selectedDate.getMonth() + 1).padStart(2, '0');
                const selDay = String(selectedDate.getDate()).padStart(2, '0');
                showTasksForDate(`${selYear}-${selMonth}-${selDay}`, selectedDate.getDate(), monthNames[selectedDate.getMonth()], selYear);
                
                hideSkeleton();
                
                // Menjalankan pengecekan notifikasi
                checkDeadlines();
            });
        }

        // 3. FUNGSI MESIN PENGECEK DEADLINE (Berjalan otomatis di Background)
        function checkDeadlines() {
            if (!currentUser || Notification.permission !== 'granted') return;

            const now = new Date();
            
            // Periksa seluruh tugas yang belum selesai
            Object.values(realTasks).flat().forEach(task => {
                // Konversi string waktu dari database
                let taskTime = "23:59"; // Default jika tidak disetel
                if (task.time && task.time.match(/^\d{1,2}:\d{2}$/)) {
                    taskTime = task.time;
                }

                // Bangun Format Tanggal Lengkap (ISO)
                const deadlineDate = new Date(`${task.dateKey}T${taskTime}:00`);
                if (isNaN(deadlineDate.getTime())) return;

                // Hitung selisih waktu dalam Menit
                const diffMs = deadlineDate - now;
                const diffMinutes = Math.floor(diffMs / (1000 * 60));

                let alertType = null;
                
                // CEK 1: Sisa 1 Hari (1440 menit) -> Toleransi trigger antara 23.5 jam - 24 jam
                if (diffMinutes <= 1440 && diffMinutes > 1410 && !notifiedTasks[`${task.id}_1day`]) {
                    alertType = '1day';
                } 
                // CEK 2: Sisa 1 Jam (60 menit) -> Toleransi 55 - 60 menit
                else if (diffMinutes <= 60 && diffMinutes > 50 && !notifiedTasks[`${task.id}_1hour`]) {
                    alertType = '1hour';
                }
                // CEK 3: Sisa 5 Menit -> Toleransi 0 - 5 menit
                else if (diffMinutes <= 5 && diffMinutes > 0 && !notifiedTasks[`${task.id}_5min`]) {
                    alertType = '5min';
                }

                // Jika ada trigger cocok, kirim push notification!
                if (alertType) {
                    triggerPushNotification(task, alertType);
                    // Catat ke memori agar tidak spam
                    notifiedTasks[`${task.id}_${alertType}`] = true;
                    localStorage.setItem(NOTIFIED_CACHE_KEY, JSON.stringify(notifiedTasks));
                }
            });
        }

        // Jalankan pengecekan setiap 1 Menit (60.000 ms)
        setInterval(checkDeadlines, 60000);

        // Fungsi Eksekutor PUSH NOTIFICATION
        function triggerPushNotification(task, type) {
            let timeMsg = "";
            if (type === '1day') timeMsg = "Besok";
            else if (type === '1hour') timeMsg = "Dalam 1 Jam";
            else if (type === '5min') timeMsg = "5 Menit lagi!! Cepat selesaikan!";

            const title = `⚠️ Peringatan Deadline: ${task.title}`;
            const options = {
                body: `Waktu tersisa: ${timeMsg}. Ketuk untuk mengumpulkan tugas sekarang.`,
                icon: 'https://i.imgur.com/PpxQu9m.png',
                badge: 'https://i.imgur.com/PpxQu9m.png',
                vibrate: [300, 100, 300, 100, 300],
                data: { url: `/home-work.html?id=${task.id}` }
            };

            // Gunakan Service Worker PWA agar notif mirip aplikasi native Android
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(function(registration) {
                    registration.showNotification(title, options);
                });
            } else {
                new Notification(title, options);
            }
        }


        // 4. RENDER KALENDER
        function renderCalendar() {
            calendarDays.innerHTML = "";
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearDisplay.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-cell', 'empty');
                calendarDays.appendChild(emptyCell);
            }

            for (let i = 1; i <= lastDay; i++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                dayCell.innerText = i;

                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayCell.classList.add('today');
                }

                if (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear()) {
                    dayCell.classList.add('selected');
                }

                if (realTasks[dateString] && realTasks[dateString].length > 0) {
                    const dotsContainer = document.createElement('div');
                    dotsContainer.classList.add('task-dots');
                    
                    const maxDots = Math.min(realTasks[dateString].length, 3);
                    for (let d = 0; d < maxDots; d++) {
                        const dot = document.createElement('div');
                        dot.classList.add('dot');
                        dotsContainer.appendChild(dot);
                    }
                    dayCell.appendChild(dotsContainer);
                }

                dayCell.addEventListener('click', () => {
                    selectedDate = new Date(year, month, i);
                    renderCalendar(); 
                    showTasksForDate(dateString, i, monthNames[month], year);
                });

                calendarDays.appendChild(dayCell);
            }
        }

        // 5. TAMPILKAN LIST TUGAS DI BAWAH
        function showTasksForDate(dateString, day, monthName, year) {
            selectedDateText.innerText = `Jadwal pada ${day} ${monthName} ${year}`;
            taskListContainer.innerHTML = ""; 

            const tasks = realTasks[dateString];

            if (tasks && tasks.length > 0) {
                tasks.forEach(task => {
                    const card = document.createElement('a');
                    card.href = `home-work.html?id=${task.id}`; 
                    card.classList.add('task-card');
                    
                    const iconClass = task.icon || "ph-file-text";
                    const timeText = task.time || "Sepanjang hari";
                    const titleText = task.title || "Tugas Tanpa Judul";
                    
                    card.innerHTML = `
                        <div class="task-icon"><i class="ph-duotone ${iconClass}"></i></div>
                        <div class="task-info">
                            <h3>${titleText}</h3>
                            <p><i class="ph-bold ph-clock"></i> ${timeText}</p>
                        </div>
                        <div class="task-action"><i class="ph-bold ph-caret-right"></i></div>
                    `;
                    taskListContainer.appendChild(card);
                });
            } else {
                taskListContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-coffee"></i>
                        <p>Kosong.<br>Tidak ada jadwal atau tugas di hari ini.</p>
                    </div>
                `;
            }
        }

        // 6. NAVIGASI BULAN
        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

    </script>
</body>
</html>
